<body>
<canvas id="c"></canvas>
<div id="ui">
<div id="pad"><div id="knob"></div></div>
<div id="btnJ">JUMP</div>
</div>
<script>
(()=>{
'use strict';
let VW=480,VH=270;
const BIG=99999,PI=Math.PI,TAU=PI*2;
const cos=Math.cos,sin=Math.sin,abs=Math.abs,floor=Math.floor,min=Math.min,max=Math.max,rnd=Math.random;
const sign=v=>v>0?1:v<0?-1:0;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const norm=a=>{a%=TAU;if(a>PI)a-=TAU;else if(a<=-PI)a+=TAU;return a};
const Q=TAU/256;
const quant=a=>Math.round(a/Q)*Q;
const cv=document.getElementById('c');
const g=cv.getContext('2d');
let dc=g;
cv.width=VW;cv.height=VH;
g.imageSmoothingEnabled=false;

let state='title',F=0,stT=0,fadeA=0,fadeDir=0,fadeCb=null,tphase=0,msel=0,retState='title',menuMode='options',selT=0,selBounce=0,hitstop=0,shake=0,hudPop=0,curMusic=null;
const menuRects=[];
let panelRect=null;

const S={music:true,sfx:true,touch:'auto',char:0,best:0,lang:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('hr3save')||'{}'))}catch(e){}
if(!S.lang)S.lang=(navigator.language||'ko').toLowerCase().indexOf('ko')===0?'ko':'en';
function save(){try{localStorage.setItem('hr3save',JSON.stringify(S))}catch(e){}}

let ac=null,mg=null;
function initAudio(){
 if(ac){if(ac.state==='suspended')ac.resume();return}
 try{const C=window.AudioContext||window.webkitAudioContext;ac=new C();mg=ac.createGain();mg.gain.value=0.22;mg.connect(ac.destination)}catch(e){ac=null}
}
function tn(f0,f1,d,type,v,t0,isMusic){
 if(!ac)return;
 if(isMusic?!S.music:!S.sfx)return;
 const t=t0||ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();
 o.type=type;
 o.frequency.setValueAtTime(f0,t);
 if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+d);
 gn.gain.setValueAtTime(v,t);
 gn.gain.exponentialRampToValueAtTime(0.001,t+d);
 o.connect(gn);gn.connect(mg);o.start(t);o.stop(t+d+0.03);
}
const SFX={
 jump:()=>tn(260,640,.14,'square',.2),
 ring:()=>{tn(1319,1319,.06,'square',.16);tn(1760,1760,.14,'square',.16,ac.currentTime+.06)},
 charge:()=>tn(180,420,.12,'sawtooth',.2),
 release:()=>tn(90,700,.25,'sawtooth',.25),
 roll:()=>tn(300,150,.15,'square',.15),
 hurt:()=>tn(500,100,.35,'sawtooth',.25),
 pop:()=>{tn(700,120,.18,'square',.22);tn(200,60,.2,'sawtooth',.2)},
 spring:()=>tn(200,900,.2,'square',.22),
 boost:()=>tn(150,1000,.3,'sawtooth',.2),
 post:()=>{tn(880,880,.1,'square',.16);tn(1175,1175,.2,'square',.16,ac.currentTime+.1)},
 burst:()=>tn(900,300,.12,'triangle',.25),
 flap:()=>tn(220,160,.07,'triangle',.18),
 sel:()=>tn(800,800,.05,'square',.14),
 ok:()=>{tn(600,600,.06,'square',.16);tn(1000,1000,.1,'square',.16,ac.currentTime+.06)},
 tick:()=>tn(1500,1500,.03,'square',.1),
 land:()=>tn(120,60,.08,'triangle',.18),
 up:()=>{[0,1,2,3].forEach(i=>tn(660*(1+i*.25),660*(1+i*.25),.1,'square',.16,ac.currentTime+i*.09))},
 super:()=>{[0,1,2,3,4,5].forEach(i=>tn(440*(1+i*.2),440*(1+i*.2)*1.5,.14,'square',.2,ac.currentTime+i*.05))},
 warn:()=>{tn(180,180,.2,'sawtooth',.2);tn(180,180,.2,'sawtooth',.2,ac.currentTime+.3)},
 goal:()=>{[523,659,784,1047].forEach((f,i)=>tn(f,f,.2,'square',.16,ac.currentTime+i*.12))}
};
function sfx(n){if(!ac||!S.sfx)return;const f=SFX[n];if(f)f()}
const mf=n=>440*Math.pow(2,(n-69)/12);
const MEL={
 title:{bpm:84,bd:4,mel:[69,0,0,72,76,0,0,72,74,0,0,71,67,0,0,0,69,0,0,72,76,0,79,76,74,0,71,0,69,0,0,0],bass:[45,45,41,43,45,45,41,43]},
 boss:{bpm:176,bd:4,mel:[69,0,72,0,76,75,76,0,69,0,72,0,77,76,0,0,67,0,71,0,74,73,74,0,67,0,71,0,76,74,0,0],bass:[45,45,43,43,41,41,43,43]},
 special:{bpm:132,bd:4,mel:[76,0,79,0,83,0,79,0,76,0,74,0,72,0,0,0,74,0,77,0,81,0,77,0,74,0,72,0,71,0,0,0],bass:[40,40,43,43,45,45,43,38]},
 stage:{bpm:150,bd:4,mel:[72,0,76,0,79,76,0,74,72,0,76,0,81,79,0,0,77,0,81,0,84,81,0,79,77,76,74,0,72,0,0,0],bass:[48,48,53,53,55,55,48,43]}
};
let mus=null,musStep=0,musNext=0;
function playMusic(name){curMusic=name;mus=name?MEL[name]:null;musStep=0;musNext=ac?ac.currentTime+.05:0}
function musicTick(){
 if(!ac||!mus||!S.music)return;
 if(musNext<ac.currentTime-.5)musNext=ac.currentTime+.05;
 const sd=60/mus.bpm/2;
 while(musNext<ac.currentTime+.25){
  const i=musStep%mus.mel.length,n=mus.mel[i];
  if(n)tn(mf(n),mf(n),sd*.9,'square',.07,musNext,true);
  const b=mus.bass[floor(i/mus.bd)%mus.bass.length];
  if(i%2===0&&b)tn(mf(b),mf(b),sd*1.8,'triangle',.14,musNext,true);
  musNext+=sd;musStep++;
 }
}

const held={left:0,right:0,up:0,down:0,jump:0,start:0,back:0};
const pressed={left:0,right:0,up:0,down:0,jump:0,start:0,back:0};
const NONE={left:0,right:0,up:0,down:0,jump:0,start:0,back:0};
const FIN={left:0,right:1,up:0,down:0,jump:0,start:0,back:0};
function setKey(k,v){if(v&&!held[k])pressed[k]=1;held[k]=v?1:0}
function clearPressed(){for(const k in pressed)pressed[k]=0}
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'jump',KeyZ:'jump',KeyX:'jump',KeyC:'jump',KeyK:'jump',Enter:'start',KeyP:'back',Escape:'back'};
addEventListener('keydown',e=>{const k=keyMap[e.code];if(k){e.preventDefault();initAudio();if(!e.repeat)setKey(k,1)}});
addEventListener('keyup',e=>{const k=keyMap[e.code];if(k){e.preventDefault();setKey(k,0)}});
addEventListener('blur',()=>{for(const k in held)held[k]=0;if(state==='play'){state='pause';menuMode='pause';msel=0}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';menuMode='pause';msel=0}});
addEventListener('contextmenu',e=>e.preventDefault());

let touchSeen=false;
try{touchSeen=matchMedia('(pointer:coarse)').matches}catch(e){}
function updateTouchUI(){document.body.classList.toggle('touch',S.touch==='on'||(S.touch==='auto'&&touchSeen))}
const padEl=document.getElementById('pad'),knob=document.getElementById('knob'),btnJ=document.getElementById('btnJ');
let padId=null;
function padMove(e){
 const r=padEl.getBoundingClientRect(),ax=(e.clientX-(r.left+r.width/2))/(r.width/2),ay=(e.clientY-(r.top+r.height/2))/(r.height/2);
 setKey('left',ax<-0.3);setKey('right',ax>0.3);setKey('up',ay<-0.45);setKey('down',ay>0.45);
 const m=Math.max(1,Math.hypot(ax,ay));
 knob.style.transform='translate('+(ax/m*38)+'%,'+(ay/m*38)+'%)';
}
function padEnd(){padId=null;setKey('left',0);setKey('right',0);setKey('up',0);setKey('down',0);knob.style.transform='none'}
padEl.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();padId=e.pointerId;try{padEl.setPointerCapture(e.pointerId)}catch(x){}padMove(e)});
padEl.addEventListener('pointermove',e=>{if(e.pointerId===padId)padMove(e)});
padEl.addEventListener('pointerup',e=>{if(e.pointerId===padId)padEnd()});
padEl.addEventListener('pointercancel',e=>{if(e.pointerId===padId)padEnd()});
btnJ.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();setKey('jump',1);btnJ.classList.add('on');try{btnJ.setPointerCapture(e.pointerId)}catch(x){}});
const jEnd=()=>{setKey('jump',0);btnJ.classList.remove('on')};
btnJ.addEventListener('pointerup',jEnd);btnJ.addEventListener('pointercancel',jEnd);
document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!touchSeen){touchSeen=true;updateTouchUI()}},true);

function layout(){
 const vw=innerWidth,vh=innerHeight,por=vh>vw,dpr=window.devicePixelRatio||1;
 const pw=Math.floor(vw*dpr),ph=Math.floor(vh*dpr);
 let k,nw,nh;
 if(por){k=Math.max(1,Math.round(pw/300));nw=Math.floor(pw/k);nh=Math.floor(min(ph*0.6,pw*1.35)/k)}
 else{
  const si=Math.round(ph/340);
  if(si>=2&&Math.floor(ph/si)>=320){k=si;nh=Math.floor(ph/si)}else{k=ph/340;nh=340}
  nw=min(Math.floor(pw/k),780);
 }
 if(nw!==VW||nh!==VH){VW=nw;VH=nh;cv.width=VW;cv.height=VH;g.imageSmoothingEnabled=false}
 const cw=VW*k/dpr,ch=VH*k/dpr,root=document.documentElement.style;
 cv.style.width=cw+'px';cv.style.height=ch+'px';cv.style.left=((vw-cw)/2)+'px';
 if(por)cv.style.top='env(safe-area-inset-top,0px)';else cv.style.top=((vh-ch)/2)+'px';
 root.setProperty('--u',(Math.min(vw,vh)/100)+'px');
 document.body.classList.toggle('portrait',por);
}

const GIDX={},GROWS=[];
FSRC.split('\n').forEach((ln,i)=>{const p=ln.split(' ');GIDX[p[0]]=i;GROWS.push(p.slice(1))});
const atlasCache={};
function atlas(col){
 let c=atlasCache[col];if(c)return c;
 c=document.createElement('canvas');c.width=GROWS.length*6;c.height=7;
 const x=c.getContext('2d');x.fillStyle=col;
 for(let i=0;i<GROWS.length;i++)for(let r=0;r<7;r++)for(let b=0;b<5;b++)if(GROWS[i][r][b]==='1')x.fillRect(i*6+b,r,1,1);
 atlasCache[col]=c;return c;
}
function drawStr(s,x,y,col,sc,ctx){
 const at=atlas(col),t=ctx||g;
 for(let i=0;i<s.length;i++){const gi=GIDX[s[i]];if(gi===undefined)continue;t.drawImage(at,gi*6,0,5,7,x+i*6*sc,y,5*sc,7*sc)}
}

}
function koDraw(s,x,y,col,ol,sc,al,sh){
 const k=koScale(sc),sp=koSpr(s,col),w=(sp.width-2)*k;
 if(al==='center')x-=w>>1;else if(al==='right')x-=w;
 x=Math.round(x)-k;y=Math.round(y+(7*sc-11*k)/2)-k;
 if(ol){
  const o=koSpr(s,ol);
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)g.drawImage(o,x+dx*k,y+dy*k,o.width*k,o.height*k);

 }else if(sh!==false){const o=koSpr(s,'#000000');g.drawImage(o,x+sc,y+sc,o.width*k,o.height*k)}
 g.drawImage(sp,x,y,sp.width*k,sp.height*k);
}
function text(s,x,y,col,sc,al,sh){
 sc=sc||1;s=String(s);

 s=s.toUpperCase();
 const w=tw(s,sc);
 if(al==='center')x-=w>>1;else if(al==='right')x-=w;
 x=Math.round(x);y=Math.round(y);

 drawStr(s,x,y,col||'#ffffff',sc);
}
function textO(s,x,y,col,ol,sc,al){

function logo(str,sc,bands,ol){
 const key=str+sc+bands.join('')+ol;
 if(logoCache[key])return logoCache[key];
 const pad=sc*2,w=tw(str,sc)+pad*2,h=7*sc+pad*2+sc*2;
 const mk=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
 const m=mk(),mx=m.getContext('2d');
 mx.imageSmoothingEnabled=false;
 drawStr(str,pad,pad,'#ffffff',sc,mx);
 const tint=col=>{const c=mk(),x=c.getContext('2d');x.drawImage(m,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,w,h);return c};
 const o=tint(ol),out=mk(),ox=out.getContext('2d');
 const ot=Math.max(1,sc>>1);for(let dy=-ot;dy<=ot*2;dy++)for(let dx=-ot;dx<=ot;dx++)ox.drawImage(o,dx,dy);
 const f=mk(),fx=f.getContext('2d');
 fx.drawImage(m,0,0);fx.globalCompositeOperation='source-atop';
 const bh=(7*sc)/bands.length;

}

function pxCircle(cx,cy,r,col,al){

function hexRGB(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]}
function pixelize(raw,pal,outline){
 const w=raw.width,h=raw.height,x=raw.getContext('2d'),id=x.getImageData(0,0,w,h),a=id.data;
 const pr=pal?pal.map(hexRGB):null,mask=new Uint8Array(w*h);
 for(let i=0;i<w*h;i++){
  const o=i*4;
  if(a[o+3]>100){
   mask[i]=1;a[o+3]=255;
   if(pr){
    let b=0,bd=1e9;
    for(let k=0;k<pr.length;k++){const dr=a[o]-pr[k][0],dg=a[o+1]-pr[k][1],db=a[o+2]-pr[k][2],d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;b=k}}
    a[o]=pr[b][0];a[o+1]=pr[b][1];a[o+2]=pr[b][2];
   }
  }else a[o+3]=0;
 }
 if(!outline){x.putImageData(id,0,0);return raw}
 const W2=w+2,H2=h+2,out=mkc(W2,H2),ox=out.getContext('2d'),oc=hexRGB(outline),od=ox.createImageData(W2,H2),b=od.data;
 for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
  const i=yy*w+xx;
  if(mask[i]){const o=((yy+1)*W2+xx+1)*4,s=i*4;b[o]=a[s];b[o+1]=a[s+1];b[o+2]=a[s+2];b[o+3]=255}
 }
 const m=(xx,yy)=>xx>=0&&yy>=0&&xx<w&&yy<h&&mask[yy*w+xx];
 for(let yy=0;yy<H2;yy++)for(let xx=0;xx<W2;xx++){
  const o=(yy*W2+xx)*4;
  if(b[o+3])continue;
  if(m(xx,yy-1)||m(xx-2,yy-1)||m(xx-1,yy)||m(xx-1,yy-2)){b[o]=oc[0];b[o+1]=oc[1];b[o+2]=oc[2];b[o+3]=255}
 }
 ox.putImageData(od,0,0);
 return out;
}
const SC={};

function solid(px,py){
 const x=floor(px),y=floor(py);
 if(x<0||x>=L.W)return true;
 if(y>=L.h[x])return true;
 const bl=L.blocks;
 for(let i=0;i<bl.length;i++){const b=bl[i];if(!b.gone&&x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h)return true}
 for(let i=0;i<L.loops.length;i++){
  const o=L.loops[i],dx=x+.5-o.cx;
  if(dx<-o.R-o.T||dx>o.R+o.T)continue;
  const dy=y+.5-o.cy,d2=dx*dx+dy*dy;
  if(d2>=o.R*o.R&&d2<=(o.R+o.T)*(o.R+o.T)){if(o.layer===0?dx>=-10:dx<10)return true}
 }
 return false;
}
function castDir(px,py,dx,dy,st,mx){
 let d=st;
 if(solid(px+dx*d,py+dy*d)){
  for(let k=0;k<16;k++){d--;if(!solid(px+dx*d,py+dy*d))return d+1}
  return null;
 }
 while(d<mx){d++;if(solid(px+dx*d,py+dy*d))return d}
 return null;
}

function ssBuild(idx){
 const N=SS.N,R=seeded(idx*131+7),dirs=[[1,0],[0,1],[-1,0],[0,-1]];
 let path=null,tries=0;

  tries++;

   const tdir=R()<0.3?(R()<0.5?1:3):0,order=[(d+tdir)%4,d,(d+1)%4,(d+3)%4];
   let placed=false;
   for(const nd of order){
    const nx=(x+dirs[nd][0]+N)%N,ny=(y+dirs[nd][1]+N)%N;
    if(!seen.has(nx*100+ny)){x=nx;y=ny;d=nd;seen.add(nx*100+ny);p.push([x,y]);placed=true;break}
   }
   if(!placed)ok=false;

 }
 if(!path){path=[];for(let i=0;i<20;i++)path.push([(10+i)%N,10])}
 const cells=new Uint8Array(N*N),onp=new Uint8Array(N*N);
 for(const q of path)onp[q[1]*N+q[0]]=1;
 for(let i=1;i<path.length;i++)cells[path[i][1]*N+path[i][0]]=1;
 const sxp=path[0][0],syp=path[0][1];
 for(const q of path){

function playerSprite(p){

 else if(p.act==='climb'){pose='climb';fr=((floor(p.y/5)%2)+2)%2}
 else if(p.act==='fly'){pose='fly';fr=floor(F/(p.flapT>0?2:4))&3}
 else if(p.onGround){
  if(p.sd||p.rolling){pose='ball';fr=floor(p.spin)&7}
  else if(p.crouch)pose='crouch';
  else if(p.skid)pose='skid';
  else if(p.push&&abs(p.gsp)<0.5){pose='push';fr=floor(p.ph*2)&7}
  else if(abs(p.gsp)>=5.8){pose='run';fr=(F>>1)&3}

  else{pose='idle';if(p.idleT>240)fr=2+((F>>4)&1);else if(F%200<7)fr=1}

 }

}

 g.fillStyle='#000000';g.fillRect(0,0,VW,VH);
 const k=bounceOut(stT/30);
 textO(tr('over'),VW/2,Math.round(VH*0.4-(1-k)*120),'#ffffff','#a02c18',Math.min(4,Math.floor((VW-20)/54)),'center');
}
function drawBoot(){
 g.fillStyle='#000000';g.fillRect(0,0,VW,VH);
 text('HYPER RUSH 3 & DIG',VW/2,VH/2-14,'#ffffff',2,'center');
 if(F>>5&1)text(tr('bootTap'),VW/2,VH/2+14,'#ffd21f',1,'center');
}
function drawIris(){
 if(fadeA<=0)return;
 const e=fadeA*fadeA*(3-2*fadeA);
 let cx=VW>>1,cy=VH>>1;
 if(state==='play'&&G.p){cx=clamp(Math.round(G.p.x-cam.x),0,VW);cy=clamp(Math.round(G.p.y-cam.y),0,VH)}
 const R=(1-e)*Math.hypot(max(cx,VW-cx),max(cy,VH-cy));
 g.fillStyle='#000000';
 if(R<=1){g.fillRect(0,0,VW,VH);return}
 for(let y=0;y<VH;y+=2){
  const dy=y+1-cy;
  if(abs(dy)>=R){g.fillRect(0,y,VW,2);continue}
  const hw=floor(Math.sqrt(R*R-dy*dy));
  if(cx-hw>0)g.fillRect(0,y,cx-hw,2);
  if(cx+hw<VW)g.fillRect(cx+hw,y,VW-cx-hw,2);
 }
}
function draw(){
 menuRects.length=0;
 g.globalAlpha=1;
 if(state==='boot')drawBoot();
 else if(state==='title')drawTitle();
 else if(state==='select')drawSelectScreen();
 else if(state==='options'){
  if(retState==='select')drawSelectScreen();else drawTitle();
  menuRects.length=0;
  drawPanel(tr('settings'),panelItems('options'),msel);
 }
 else if(state==='special')ssDraw();
 else if(state==='card')drawCard();
 else if(state==='results')drawResults();
 else if(state==='ending')drawEnding();
 else if(state==='over')drawOver();
 else{
  drawWorld();drawHUD();
  if(state==='pause'){menuRects.length=0;drawPanel(tr('paused'),panelItems('pause'),msel)}
 }
 drawIris();
}

function fadeTo(cb){if(fadeDir!==0)return;fadeDir=1;fadeCb=cb}
function startGame(){
 G.score=0;G.lives=3;G.act=0;G.p=null;G.em=[0,0,0,0,0,0,0];
 fadeTo(()=>{beginAct();state='card';stT=0;playMusic(null)});
}
function openSettings(){
 sfx('ok');
 if(state==='play'){state='pause';menuMode='pause';msel=0}
 else{retState=state;state='options';menuMode='options';msel=0}
}
function doItem(id){
 if(id==='resume'){state='play';sfx('ok')}
 else if(id==='music'){S.music=!S.music;save();sfx('sel')}
 else if(id==='sfx'){S.sfx=!S.sfx;save();sfx('sel')}
 else if(id==='touch'){const m=['auto','on','off'];S.touch=m[(m.indexOf(S.touch)+1)%3];updateTouchUI();save();sfx('sel')}
 else if(id==='lang'){S.lang=S.lang==='ko'?'en':'ko';save();sfx('sel')}
 else if(id==='fs'){toggleFS()}
 else if(id==='restart'){sfx('ok');fadeTo(()=>{beginAct();state='card';stT=0;playMusic(null)})}
 else if(id==='quit'){sfx('ok');fadeTo(()=>{state='title';tphase=1;msel=0;stT=0;menuT0=0;playMusic('title')})}
 else if(id==='back'){state=retState;sfx('ok')}
}
function pickChar(i,start){
 if(S.char===i&&start){sfx('ok');startGame();return}
 if(S.char!==i){S.char=i;save();sfx('sel')}
 selBounce=14;
}
function tap(x,y){
 initAudio();
 if(fadeDir!==0)return;
 if(state==='boot'){pressed.jump=1;return}
 if(state==='title'&&tphase===0&&!(x>VW-44&&y<40)){pressed.jump=1;return}
 if(state==='results'||state==='ending'||state==='over'){pressed.jump=1;return}
 if((state==='play'||state==='title'||state==='select')&&x>VW-44&&y<40){openSettings();return}
 if(state==='options'||state==='pause'){
  const pr=panelRect;
  if(pr&&(x<pr.x||x>pr.x+pr.w||y<pr.y||y>pr.y+pr.h)){if(state==='pause'){state='play';sfx('ok')}else{state=retState;sfx('ok')}return}
 }
 for(const r of menuRects){
  if(x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h){
   if(state==='title'){
    if(r.id==='start'){sfx('ok');fadeTo(()=>{state='select';stT=0;selT=0})}
    else if(r.id==='options')openSettings();
   }else if(state==='select'){
    if(r.id==='go'){sfx('ok');startGame()}
    else if(r.id==='back'){sfx('ok');fadeTo(()=>{state='title';tphase=1;msel=0;stT=40;menuT0=0})}
    else if(r.id[0]==='c')pickChar(+r.id[1],true);
   }else if(state==='options'||state==='pause')doItem(r.id);
   return;
  }
 }
}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();
 const r=cv.getBoundingClientRect();
 tap((e.clientX-r.left)*VW/r.width,(e.clientY-r.top)*VH/r.height);
});

function calcBonus(){
 const sec=floor(G.time/60);
 const tb=sec<30?50000:sec<45?10000:sec<60?5000:sec<90?4000:sec<120?3000:sec<180?2000:sec<240?1000:0;
 G.bonus={tb,rb:G.p.rings*100,done:false,wait:0};
}
function nextAfterResults(){
 if(G.act<ACTS.length-1){G.act++;fadeTo(()=>{beginAct();state='card';stT=0})}
 else fadeTo(()=>{state='ending';stT=0;PT.length=0;if(G.score>S.best){S.best=G.score;save()}});
}
function updateFade(){
 if(fadeDir>0){fadeA+=0.05;if(fadeA>=1){fadeA=1;fadeDir=-1;if(fadeCb){const c=fadeCb;fadeCb=null;c()}}}
 else if(fadeDir<0){fadeA-=0.05;if(fadeA<=0){fadeA=0;fadeDir=0}}
}
function menuNav(n){
 if(pressed.up){msel=(msel+n-1)%n;sfx('sel')}
 if(pressed.down){msel=(msel+1)%n;sfx('sel')}
}
function update(){
 F++;stT++;
 updateFade();
 musicTick();
 document.body.classList.toggle('ingame',state==='play'||state==='card'||state==='special');
 if(fadeDir>0)return;
 if(shake>0)shake--;
 if(hudPop>0)hudPop--;
 const ok=pressed.jump||pressed.start||pressed.back;
 if(state==='boot'){
  if(ok||pressed.up||pressed.down||pressed.left||pressed.right){initAudio();state='title';stT=0;tphase=0;playMusic('title')}
 }else if(state==='title'){
  updatePT();
  if(tphase===0){if(ok){sfx('ok');tphase=1;msel=0;menuT0=stT}}
  else{
   menuNav(2);
   if(ok){
    if(msel===0){sfx('ok');fadeTo(()=>{state='select';stT=0;selT=0})}
    else openSettings();
   }
  }
 }else if(state==='select'){
  selT++;if(selBounce>0)selBounce--;
  updatePT();
  if(pressed.left){S.char=(S.char+2)%3;save();sfx('sel');selBounce=14}
  if(pressed.right){S.char=(S.char+1)%3;save();sfx('sel');selBounce=14}
  if(pressed.jump||pressed.start){sfx('ok');startGame()}
  else if(pressed.back)fadeTo(()=>{state='title';tphase=1;msel=0;stT=40;menuT0=0});
 }else if(state==='options'||state==='pause'){
  const items=panelItems(state==='pause'?'pause':'options');
  menuNav(items.length);
  if(pressed.back){if(state==='pause'){state='play';sfx('ok')}else{state=retState;sfx('ok')}}
  else if(pressed.jump||pressed.start)doItem(items[msel][0]);
  else if(pressed.left||pressed.right){const id=items[msel][0];if(id==='music'||id==='sfx'||id==='touch'||id==='lang')doItem(id)}
 }else if(state==='special'){
  ssUpdate();
 }else if(state==='card'){
  if(stT%3===0)updatePT();
  if(stT>140){state='play';stT=0;playMusic('stage')}
 }else if(state==='play'){
  if(pressed.start||pressed.back){state='pause';menuMode='pause';msel=0;sfx('sel');return}
  const p=G.p;
  updateFC();
  if(G.gemT>0)G.gemT--;if(G.warnT>0)G.warnT--;if(G.hintT>0)G.hintT--;if(G.msgT>0)G.msgT--;if(G.flash>0)G.flash--;
  if(hitstop>0){hitstop--;updatePT();return}
  if(!p.dead&&!G.fin)G.time++;
  updatePlayer(p);
  updateEnts();
  updatePT();
  updateCam(p);
  if(!p.dead&&G.time>=36000)die(p);
  if(p.dead&&p.deadT>90&&fadeDir===0){
   fadeTo(()=>{
    G.lives--;
    if(G.lives<=0){state='over';stT=0;playMusic(null);if(G.score>S.best){S.best=G.score;save()}}
    else spawn();
   });
  }
  if(G.fin){
   G.finT++;
   if(G.finT<110&&G.finT%2===0)pt(cam.x+rnd()*VW,cam.y-4,(rnd()-.5)*1.2,0.9+rnd()*0.6,110,'conf',['#ffd21f','#ff5a5a','#3aa0ff','#7be06f','#ffffff'][(rnd()*5)|0],1,0.01);
   if(G.finT>160&&fadeDir===0)fadeTo(()=>{calcBonus();state='results';stT=0});
  }
 }else if(state==='results'){
  const b=G.bonus;
  if(stT>60&&!b.done){
   if(ok){G.score+=b.tb+b.rb;b.tb=0;b.rb=0}
   else{
    const st=100;
    if(b.tb>0){const d=min(st,b.tb);b.tb-=d;G.score+=d}
    else if(b.rb>0){const d=min(st,b.rb);b.rb-=d;G.score+=d}
    if(F%4===0&&(b.tb>0||b.rb>0))sfx('tick');
   }
   if(b.tb===0&&b.rb===0){b.done=true;b.wait=0;sfx('ok')}
  }else if(b.done){
   b.wait++;
   if((ok&&b.wait>10)||b.wait>300){if(fadeDir===0)nextAfterResults()}
  }
 }else if(state==='ending'){
  updatePT();
  if(stT%3===0)pt(rnd()*VW,-4,(rnd()-.5)*1.2,0.9+rnd()*0.6,200,'conf',['#ffd21f','#ff5a5a','#3aa0ff','#7be06f','#ffffff'][(rnd()*5)|0],1,0.01);
  if(ok&&stT>30&&fadeDir===0)fadeTo(()=>{state='title';tphase=1;msel=0;stT=40;menuT0=0;PT.length=0;playMusic('title')});
 }else if(state==='over'){
  if(stT>200||(ok&&stT>40)){if(fadeDir===0)fadeTo(()=>{state='title';tphase=1;msel=0;stT=40;menuT0=0;playMusic('title')})}
 }
}

let last=performance.now(),acc=0;
function frame(t){
 let dt=t-last;last=t;
 if(dt>100)dt=100;
 acc+=dt;
 while(acc>=1000/60){update();clearPressed();acc-=1000/60}
 draw();
 requestAnimationFrame(frame);
}
layout();
updateTouchUI();
playMusic('title');
if(window.HR3_TEST){window.HR3_TEST.api={G,L,S,update,draw,held,pressed,clearPressed,beginAct,build,solid,setState:s=>{state=s},getState:()=>state,cam,tap,setSize:(w,h)=>{VW=w;VH=h;cv.width=w;cv.height=h},menuRects,PT,setPhase:n=>{tphase=n},setStT:n=>{stT=n},setSel:n=>{S.char=n},goSuper,L,SS,ssBuild,enterSpecial}}
else requestAnimationFrame(frame);
})();
</script>
